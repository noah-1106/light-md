name: Release

# App Store Connect uploads are manual; GitHub Releases are published separately.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Release operation
        type: choice
        options:
          - mas
          - notarize
        default: mas
      tag:
        description: GitHub Release tag to notarize
        required: false
        default: v1.0.6
        type: string
      build_number:
        description: MAS CFBundleVersion (unique; at most three numeric components)
        required: true
        default: 7
        type: string

jobs:
  publish-mas:
    if: inputs.operation == 'mas'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'aarch64-apple-darwin,x86_64-apple-darwin'

      - name: Install frontend dependencies
        run: npm install

      - name: Set up signing keychains
        env:
          MAS_P12: ${{ secrets.APPLE_CERTIFICATE_MAS }}
          MAS_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_MAS_PASSWORD }}
          INSTALLER_P12: ${{ secrets.APPLE_CERTIFICATE_MAS_INSTALLER }}
          INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_MAS_INSTALLER_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -e
          # Create app keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" signing_temp_app.keychain
          security set-keychain-settings -lut 21600 signing_temp_app.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" signing_temp_app.keychain
          echo "$MAS_P12" | base64 -d > /tmp/mas_app.p12
          security import /tmp/mas_app.p12 -k signing_temp_app.keychain -P "$MAS_P12_PASSWORD" -f pkcs12 -A -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" signing_temp_app.keychain
          security list-keychains -d user -s signing_temp_app.keychain login.keychain
          rm /tmp/mas_app.p12

          # Create installer keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" signing_temp_installer.keychain
          security set-keychain-settings -lut 21600 signing_temp_installer.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" signing_temp_installer.keychain
          echo "$INSTALLER_P12" | base64 -d > /tmp/mas_installer.p12
          security import /tmp/mas_installer.p12 -k signing_temp_installer.keychain -P "$INSTALLER_P12_PASSWORD" -f pkcs12 -A -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" signing_temp_installer.keychain
          security list-keychains -d user -s signing_temp_installer.keychain signing_temp_app.keychain login.keychain
          rm /tmp/mas_installer.p12

      - name: Build Tauri (MAS .app)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "3rd Party Mac Developer Application: Tan Zaichao (UWJL48X4C8)"
          APPLE_TEAM_ID: "UWJL48X4C8"
        with:
          args: '--target universal-apple-darwin --bundles app'

      - name: Set MAS build number
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          PLIST="src-tauri/target/universal-apple-darwin/release/bundle/macos/Light MD.app/Contents/Info.plist"
          MARKETING_VERSION=$(node -p "require('./package.json').version")
          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+([.][0-9]+){0,2}$ ]]; then
            printf 'Invalid CFBundleVersion: %s\n' "$BUILD_NUMBER" >&2
            exit 1
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = "$BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = "$MARKETING_VERSION"

      - name: Embed Mac App Store provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APP_SIGNING_IDENTITY: "3rd Party Mac Developer Application: Tan Zaichao (UWJL48X4C8)"
        run: |
          set -euo pipefail
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/Light MD.app"
          PROFILE_PATH="$RUNNER_TEMP/Light_MD_Mac_App_Store.provisionprofile"
          trap 'rm -f "$PROFILE_PATH"' EXIT
          printf '%s\n' "$PROVISIONING_PROFILE" | base64 -d > "$PROFILE_PATH"
          chmod 600 "$PROFILE_PATH"
          cp "$PROFILE_PATH" "$APP_PATH/Contents/embedded.provisionprofile"
          chmod 644 "$APP_PATH/Contents/embedded.provisionprofile"
          non_readable=$(find "$APP_PATH" -type f ! -perm -044 -print)
          if [ -n "$non_readable" ]; then
            printf 'Files not readable by all users:\n%s\n' "$non_readable" >&2
            exit 1
          fi
          codesign --force --sign "$APP_SIGNING_IDENTITY" \
            --entitlements "src-tauri/Entitlements.mas.plist" \
            --timestamp=none \
            "$APP_PATH"
          cmp "$PROFILE_PATH" "$APP_PATH/Contents/embedded.provisionprofile"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Build MAS installer .pkg
        env:
          INSTALLER_IDENTITY: "3rd Party Mac Developer Installer: Tan Zaichao (UWJL48X4C8)"
        run: |
          set -euo pipefail
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/Light MD.app"
          PKG_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/Light MD.pkg"
          mkdir -p "src-tauri/target/universal-apple-darwin/release/bundle/macos"
          productbuild --component "$APP_PATH" /Applications "$PKG_PATH" --sign "$INSTALLER_IDENTITY"
          pkgutil --check-signature "$PKG_PATH"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/.private_keys
          echo "$APPLE_API_KEY" | base64 -d > ~/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

      - name: Upload to App Store Connect
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun altool --upload-app \
            --type macos \
            --file "src-tauri/target/universal-apple-darwin/release/bundle/macos/Light MD.pkg" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER"

  notarize-dmg:
    if: inputs.operation == 'notarize'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Download signed release asset
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: noah-1106/light-md
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          asset="Light.MD_${TAG#v}_aarch64.dmg"
          gh release download "$TAG" --pattern "$asset" --dir "$RUNNER_TEMP"
          echo "path=$RUNNER_TEMP/$asset" >> "$GITHUB_OUTPUT"

      - name: Write App Store Connect API key
        id: api-key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          key_dir="$RUNNER_TEMP/notary_keys"
          mkdir -p "$key_dir"
          key_path="$key_dir/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s\n' "$APPLE_API_KEY" | base64 -d > "$key_path"
          chmod 600 "$key_path"
          echo "path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple DMG
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          DMG_PATH: ${{ steps.download.outputs.path }}
          KEY_PATH: ${{ steps.api-key.outputs.path }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "$DMG_PATH" \
            --key "$KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --timeout 30m
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl -a -t open --context context:primary-signature -v "$DMG_PATH"

      - name: Verify app Gatekeeper assessment
        env:
          DMG_PATH: ${{ steps.download.outputs.path }}
        run: |
          set -euo pipefail
          mount_point="$RUNNER_TEMP/light-md-mounted"
          mkdir -p "$mount_point"
          hdiutil attach "$DMG_PATH" -nobrowse -readonly -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point" || true' EXIT
          codesign --verify --deep --strict --verbose=2 "$mount_point/Light MD.app"
          spctl -a -t exec -vv "$mount_point/Light MD.app"

      - name: Replace GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: noah-1106/light-md
          TAG: ${{ inputs.tag }}
          DMG_PATH: ${{ steps.download.outputs.path }}
        run: gh release upload "$TAG" "$DMG_PATH" --clobber

      - name: Remove temporary API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/notary_keys"
