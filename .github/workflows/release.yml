name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-mas:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'aarch64-apple-darwin,x86_64-apple-darwin'

      - name: Install frontend dependencies
        run: npm install

      - name: Set up signing keychains
        env:
          MAS_P12: ${{ secrets.APPLE_CERTIFICATE_MAS }}
          MAS_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_MAS_PASSWORD }}
          INSTALLER_P12: ${{ secrets.APPLE_CERTIFICATE_MAS_INSTALLER }}
          INSTALLER_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_MAS_INSTALLER_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          set -e
          # Create app keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" signing_temp_app.keychain
          security set-keychain-settings -lut 21600 signing_temp_app.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" signing_temp_app.keychain
          echo "$MAS_P12" | base64 -d > /tmp/mas_app.p12
          security import /tmp/mas_app.p12 -k signing_temp_app.keychain -P "$MAS_P12_PASSWORD" -f pkcs12 -A -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" signing_temp_app.keychain
          security set-keychain-list -d user -s signing_temp_app.keychain login.keychain
          rm /tmp/mas_app.p12

          # Create installer keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" signing_temp_installer.keychain
          security set-keychain-settings -lut 21600 signing_temp_installer.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" signing_temp_installer.keychain
          echo "$INSTALLER_P12" | base64 -d > /tmp/mas_installer.p12
          security import /tmp/mas_installer.p12 -k signing_temp_installer.keychain -P "$INSTALLER_P12_PASSWORD" -f pkcs12 -A -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" signing_temp_installer.keychain
          security set-keychain-list -d user -s signing_temp_installer.keychain signing_temp_app.keychain login.keychain
          rm /tmp/mas_installer.p12

      - name: Build Tauri (MAS .app)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "3rd Party Mac Developer Application: Tan Zaichao (UWJL48X4C8)"
          APPLE_TEAM_ID: "UWJL48X4C8"
        with:
          args: '--target universal-apple-darwin --bundles app'

      - name: Build MAS installer .pkg
        env:
          INSTALLER_IDENTITY: "3rd Party Mac Developer Installer: Tan Zaichao (UWJL48X4C8)"
        run: |
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/Light MD.app"
          PKG_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/Light MD.pkg"
          mkdir -p "src-tauri/target/universal-apple-darwin/release/bundle/macos"
          productbuild --component "$APP_PATH" /Applications "$PKG_PATH" --sign "$INSTALLER_IDENTITY"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p ~/.private_keys
          echo "$APPLE_API_KEY" | base64 -d > ~/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

      - name: Upload to App Store Connect
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          xcrun altool --upload-app \
            --type macos \
            --file "src-tauri/target/universal-apple-darwin/release/bundle/macos/Light MD.pkg" \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER"
